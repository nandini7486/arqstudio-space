<style>
:root{--ink:#000;--paper:#f3f3f1;--stone:#9a9a96;--ash:#5e5e5b;--ease:cubic-bezier(.2,.7,.2,1)}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--ink);color:var(--paper);font-family:Outfit,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(28px,6vh,64px) 24px clamp(16px,3vh,32px)}
.lg{animation:fl 6s ease-in-out 1.6s infinite alternate}
.logo{display:block;width:clamp(220px,34vw,440px);height:auto;max-width:100%;opacity:0;animation:rise 1.3s var(--ease) forwards}
.stem{position:relative;overflow:hidden;width:1px;height:clamp(32px,6vh,64px);margin:clamp(18px,4vh,40px) 0 clamp(16px,3.5vh,32px);background:rgba(243,243,241,.08)}
.stem::after{content:"";position:absolute;inset:0 0 auto 0;height:60%;background:linear-gradient(transparent,var(--paper),transparent);animation:st 2.4s linear infinite}
h1{margin:0;white-space:nowrap;font-weight:200;font-size:clamp(2.5rem,7vw,5.5rem);line-height:1;letter-spacing:-.025em}
h1 span{display:inline-block;opacity:0;animation:rise 1s var(--ease) forwards,wave 4.8s ease-in-out infinite;animation-delay:calc(var(--i)*80ms + .9s),calc(var(--i)*150ms + 3.4s)}
.lead{margin:clamp(14px,2.5vh,24px) 0 0;max-width:34em;color:var(--stone);font-weight:300;font-size:clamp(1rem,1.35vw,1.2rem);line-height:1.6}
.w{display:inline-block;opacity:0;animation:rise .9s var(--ease) forwards;animation-delay:calc(var(--i)*70ms + 2s)}
ul{list-style:none;margin:clamp(28px,6vh,56px) 0 0;padding:0;display:flex;justify-content:center;gap:clamp(22px,4vw,48px)}
li{opacity:0;animation:rise .9s var(--ease) forwards}
li:nth-child(1){animation-delay:3s}li:nth-child(2){animation-delay:3.15s}li:nth-child(3){animation-delay:3.3s}
li a{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--stone);text-decoration:none;font-size:.72rem;font-weight:400;letter-spacing:.16em;text-transform:uppercase}
.ic{display:grid;place-items:center;width:clamp(54px,6vw,66px);height:clamp(54px,6vw,66px);border:1px solid rgba(243,243,241,.3);border-radius:50%;color:var(--paper);transition:background-color .3s,color .3s,border-color .3s}
.ic svg{width:42%;height:42%}
li a:focus-visible{outline:1px solid var(--paper);outline-offset:6px;border-radius:8px}
li a:active .ic{background:var(--paper);color:var(--ink)}
@media (hover:hover){li a:hover .ic{background:var(--paper);color:var(--ink);border-color:var(--paper)}li a:hover{color:var(--paper)}}
.mail{margin:20px 0 0;font-size:.85rem;font-weight:300;letter-spacing:.04em;opacity:0;animation:rise .9s ease forwards 3.5s}
.mail a{color:var(--stone);text-decoration:none;border-bottom:1px solid rgba(154,154,150,.3);padding-bottom:2px;overflow-wrap:anywhere}
.mail a:hover,.mail a:focus-visible{color:var(--paper);border-color:var(--paper);outline:none}
footer{padding:0 24px clamp(18px,3vh,28px);text-align:center;color:var(--ash);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;opacity:0;animation:rise .9s ease forwards 3.7s}
@keyframes rise{from{opacity:0;transform:translateY(70%);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes wave{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fl{to{transform:translateY(-6px)}}
@keyframes st{from{transform:translateY(-100%)}to{transform:translateY(170%)}}
@media (max-width:480px){ul{gap:20px}li a{font-size:.66rem;letter-spacing:.12em}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.logo,h1 span,.w,li,.mail,footer{opacity:1!important;filter:none!important;transform:none!important}.stem::after{display:none}}
</style>
